name: Check-plugin-updates

on:
  schedule:
    - cron: '42 0,4,8,12,16,20 * * *'
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: catalog

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          coverage: none

      - name: Check for updates
        run: |
          cd catalog
          # Write to files first so that a failing script fails the step (it is ignored inside a pipe).
          php scripts/checknewversions.php > "$RUNNER_TEMP/plugins.txt"
          php scripts/checkcoreversions.php > "$RUNNER_TEMP/core.txt"
          while IFS= read -r line; do
            echo "Dispatching process_plugin_version: $line"
            echo "$line" | gh workflow run process_plugin_version.yml --json
          done < "$RUNNER_TEMP/plugins.txt"
          while IFS= read -r line; do
            echo "Dispatching process_core_version: $line"
            echo "$line" | gh workflow run process_core_version.yml --json
          done < "$RUNNER_TEMP/core.txt"
        env:
          # workflow_dispatch is allowed to trigger new runs when using GITHUB_TOKEN.
          GH_TOKEN: ${{ github.token }}
